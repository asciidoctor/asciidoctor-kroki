name: Build Ruby

on:
  push:
    paths:
      - 'ruby/**'
      - '.kroki-version'
    branches:
      - main
  pull_request:
    paths:
      - 'ruby/**'
      - '.kroki-version'
    branches:
      - '*'

  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        ruby: ['2.7', '3.4']
        exclude:
          - os: ubuntu-latest
            ruby: '2.7'
        include:
          # Ruby 2.7 is not available on ubuntu-26.04, which is now ubuntu-latest
          - os: ubuntu-24.04
            ruby: '2.7'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ./ruby
      - run: bundle exec rake
        working-directory: ./ruby
        env:
          RUBYOPT: "W:deprecated"
